version: '3.8'

services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/data
      - ./backend/app.db:/app/app.db
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: always

volumes:
  db_data:
